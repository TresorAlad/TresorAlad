<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Technology matrix: frontend, backend, cloud and DevOps, AI and data">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
    @keyframes fill { from { width: 0; } }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: translateX(-1600px); } to { transform: translateX(1600px); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .c1 { animation: rise .8s ease-out .2s both; }
    .c2 { animation: rise .8s ease-out .45s both; }
    .c3 { animation: rise .8s ease-out .7s both; }
    .c4 { animation: rise .8s ease-out .95s both; }
    .bar { animation: fill 1.8s cubic-bezier(.2,.7,.2,1) 1.2s both; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    .sweep { animation: sweep 6s linear infinite; }
    .f1 { animation: float 5s ease-in-out infinite; }
    .f2 { animation: float 5s ease-in-out 1.2s infinite; }
    .f3 { animation: float 5s ease-in-out 2.4s infinite; }
    .f4 { animation: float 5s ease-in-out 3.6s infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/><stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="o" x1="0" x2="1"><stop offset="0" stop-color="#F7941D"/><stop offset="1" stop-color="#ffb35c"/></linearGradient>
    <linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#1E90FF"/><stop offset="1" stop-color="#7cc0ff"/></linearGradient>
    <linearGradient id="sw" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".07"/></pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#dots)"/>
    <rect class="sweep" width="500" height="900" fill="url(#sw)"/>

    <g class="sans">
      <text class="mono c1" x="80" y="110" font-size="20" fill="#F7941D" letter-spacing="6">// 02 — TECHNOLOGY MATRIX</text>
      <text class="c1" x="78" y="180" font-size="60" font-weight="800" fill="#fff" letter-spacing="-1.5">The tools I build with</text>
      <g class="c1 mono" font-size="17" fill="#8b93a7">
        <circle cx="1352" cy="104" r="6" fill="#28c840" class="live"/>
        <text x="1520" y="110" text-anchor="end">ACTIVELY USED</text>
      </g>
    </g>

    <!-- Card template: x, y, 680x300 -->
    <!-- Data engineering -->
    <g class="c1"><g class="f1">
      <rect x="80" y="240" width="700" height="290" rx="24" fill="#0b0f18" stroke="#F7941D" stroke-opacity=".35"/>
      <text class="mono" x="116" y="292" font-size="16" fill="#F7941D" letter-spacing="4">01 · DATA ENGINEERING</text>
      <text class="sans" x="116" y="340" font-size="34" font-weight="700" fill="#fff">Reliable pipelines</text>
      <g class="mono" font-size="18" fill="#e6e9f0">
        <text x="116" y="398">Python</text><rect x="300" y="386" width="440" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="300" y="386" width="410" height="10" rx="5" fill="url(#o)"/>
        <text x="116" y="440">SQL · ETL</text><rect x="300" y="428" width="440" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="300" y="428" width="390" height="10" rx="5" fill="url(#o)"/>
        <text x="116" y="482">Pandas · NumPy</text><rect x="300" y="470" width="440" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="300" y="470" width="340" height="10" rx="5" fill="url(#o)"/>
      </g>
    </g></g>

    <!-- ML & AI -->
    <g class="c2"><g class="f2">
      <rect x="820" y="240" width="700" height="290" rx="24" fill="#0b0f18" stroke="#1E90FF" stroke-opacity=".35"/>
      <text class="mono" x="856" y="292" font-size="16" fill="#7cc0ff" letter-spacing="4">02 · ML &amp; AI</text>
      <text class="sans" x="856" y="340" font-size="34" font-weight="700" fill="#fff">Models &amp; agents</text>
      <g class="mono" font-size="18" fill="#e6e9f0">
        <text x="856" y="398">TensorFlow</text><rect x="1040" y="386" width="440" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="1040" y="386" width="360" height="10" rx="5" fill="url(#b)"/>
        <text x="856" y="440">scikit-learn</text><rect x="1040" y="428" width="440" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="1040" y="428" width="330" height="10" rx="5" fill="url(#b)"/>
        <text x="856" y="482">LLMs · RAG</text><rect x="1040" y="470" width="440" height="10" rx="5" fill="#fff" fill-opacity=".07"/><rect class="bar" x="1040" y="470" width="300" height="10" rx="5" fill="url(#b)"/>
      </g>
    </g></g>

    <!-- Cloud -->
    <g class="c3"><g class="f3">
      <rect x="80" y="560" width="700" height="290" rx="24" fill="#0b0f18" stroke="#1E90FF" stroke-opacity=".35"/>
      <text class="mono" x="116" y="612" font-size="16" fill="#7cc0ff" letter-spacing="4">03 · CLOUD &amp; DEVOPS</text>
      <text class="sans" x="116" y="660" font-size="34" font-weight="700" fill="#fff">Ship &amp; automate</text>
      <g class="mono" font-size="17">
        <rect x="116" y="696" width="120" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="176" y="724" text-anchor="middle" fill="#7cc0ff">Azure</text>
        <rect x="250" y="696" width="110" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="305" y="724" text-anchor="middle" fill="#7cc0ff">Docker</text>
        <rect x="374" y="696" width="130" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="439" y="724" text-anchor="middle" fill="#7cc0ff">GitHub Actions</text>
        <rect x="518" y="696" width="120" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="578" y="724" text-anchor="middle" fill="#7cc0ff">Go CLI</text>
        <rect x="116" y="756" width="140" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="186" y="784" text-anchor="middle" fill="#7cc0ff">CI / CD</text>
        <rect x="270" y="756" width="150" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="345" y="784" text-anchor="middle" fill="#7cc0ff">APIs REST</text>
        <rect x="434" y="756" width="160" height="44" rx="12" fill="#1E90FF" fill-opacity=".14"/><text x="514" y="784" text-anchor="middle" fill="#7cc0ff">MCP · agents</text>
      </g>
    </g></g>

    <!-- Databases & apps -->
    <g class="c4"><g class="f4">
      <rect x="820" y="560" width="700" height="290" rx="24" fill="#0b0f18" stroke="#F7941D" stroke-opacity=".35"/>
      <text class="mono" x="856" y="612" font-size="16" fill="#F7941D" letter-spacing="4">04 · DBA &amp; APPS</text>
      <text class="sans" x="856" y="660" font-size="34" font-weight="700" fill="#fff">Data &amp; products</text>
      <g class="mono" font-size="17">
        <rect x="856" y="696" width="150" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="931" y="724" text-anchor="middle" fill="#ffb35c">MongoDB</text>
        <rect x="1020" y="696" width="150" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="1095" y="724" text-anchor="middle" fill="#ffb35c">PostgreSQL</text>
        <rect x="1184" y="696" width="120" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="1244" y="724" text-anchor="middle" fill="#ffb35c">MySQL</text>
        <rect x="856" y="756" width="140" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="926" y="784" text-anchor="middle" fill="#ffb35c">Next.js</text>
        <rect x="1010" y="756" width="130" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="1075" y="784" text-anchor="middle" fill="#ffb35c">TypeScript</text>
        <rect x="1154" y="756" width="120" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="1214" y="784" text-anchor="middle" fill="#ffb35c">React</text>
        <rect x="1288" y="756" width="140" height="44" rx="12" fill="#F7941D" fill-opacity=".14"/><text x="1358" y="784" text-anchor="middle" fill="#ffb35c">Node.js</text>
      </g>
    </g></g>

    <rect x="1" y="1" width="1598" height="898" rx="36" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  </g>
</svg>
